name: Expresiones en GitHub Actions
run-name: Runner - Expresiones en GitHub Actions
on:
    push
jobs:
    quiz-expresiones:
        runs-on: ubuntu-latest

        env: 
            QUIZ_NOMBRE: Ada Lovelace
            QUIZ_LENGUAJE: Python
            QUIZ_NUMERO: 42
            QUIZ_ENTORNO: production
            QUIZ_FUNCION: true
            TEMP_INT_TO_HEXA: 26
            TEMP_HEXA_TO_INT: 0
            QUIZ_HEXADECIMAL: 0
            QUIZ_FLOAT: 3.14159
            TEMP_JSON: '{"nombre": "Ada Lovelace", "lenguaje": "Python", "numero": 100, "flotante": 2.71828, "booleano": true}'
            QUIZ_FROMJSON_NUMERO: 0
            TEMP_GITHUB_ACTIONS: GitHub Actions
            TEMP_STRING_JSON: JSON


            

        steps:
            - name: Checkout del repositorio
              uses: actions/checkout@v4

            - name: Imprimir variables
              run: |
                   echo "Nombre: ${{ env.QUIZ_NOMBRE }}"
                   echo "Lenguaje: ${{ env.QUIZ_LENGUAJE }}"
                   echo "Número: ${{ env.QUIZ_NUMERO }}"
                   echo "Entorno: ${{ env.QUIZ_ENTORNO }}"
                   echo "Función: ${{ env.QUIZ_FUNCION }}"
                   echo "temp_int_to_hexa: ${{ env.TEMP_INT_TO_HEXA }}"
                   echo "temp_hexa_to_int: ${{ env.TEMP_HEXA_TO_INT }}"
                   echo "Hexadecimal: ${{ env.QUIZ_HEXADECIMAL }}"
                   echo "Flotante: ${{ env.QUIZ_FLOAT }}"
                   echo "Temp JSON: ${{ env.TEMP_JSON }}"
                   echo "Quiz fromJSON Numero: ${{ env.QUIZ_FROMJSON_NUMERO }}"
                   echo "Temp GitHub Actions: ${{ env.TEMP_GITHUB_ACTIONS }}
                   echo "Temp String JSON: ${{ env.TEMP_STRING_JSON }}"


            - name: Convertir decimal a hexadecimal
              run: |
                  decimal=${{ env.TEMP_INT_TO_HEXA }}
                  hexadecimal=$(printf '%x' $decimal)
                  quiz_hexadecimal=$(printf '%d\n' "0x$hexadecimal")
                  echo "Decimal: $decimal"
                  echo "Hexadecimal: $hexadecimal"
                  echo "Decimal a Hexadecimal: $quiz_hexadecimal"
                  echo "QUIZ_HEXADECIMAL=$quiz_hexadecimal" >> $GITHUB_ENV

            - name: Extraer numero de JSON (fromJSON)
              run:  |
                  echo "QUIZ_FROMJSON_NUMERO=${{fromJson(env.TEMP_JSON).numero}}" >> $GITHUB_ENV

            - name: Extraer flotante de JSON (fromJSON)
              run:  |
                  echo "QUIZ_FROMJSON_FLOAT=${{fromJson(env.TEMP_JSON).flotante}}" >> $GITHUB_ENV

            - name: Extraer booleano de JSON (fromJSON)
              run:  |
                  echo "QUIZ_FROMJSON_BOOLEANO=${{fromJson(env.TEMP_JSON).booleano}}" >> $GITHUB_ENV

            - name: Convertir a JSON Array (toJSON)
              run: |
                  echo 'QUIZ_TOJSON_LISTA=${{ toJSON(fromJSON(format('["{0}", "{1}", "{2}"]', env.QUIZ_LENGUAJE, env.TEMP_GITHUB_ACTIONS, env.TEMP_STRING_JSON))) }}' >> $GITHUB_ENV

            #- name: Convertir a JSON Object (toJSON)
            #  run: |
            #      echo 'QUIZ_TOJSON_OBJETO=${{format('{}')}}'


            - name: Ejecutar quiz_expresiones.py
              run: python quiz_expresiones.py